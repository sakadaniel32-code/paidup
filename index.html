<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paidup · quotes, invoices, paid</title>
<meta name="theme-color" content="#F2F2F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECECEC;--card:#FFFFFF;--soft:#F3F3F3;--line:#E7E7E7;--text:#111111;--muted:#8B8B8B;--lime:#C9F230;--ink:#111111;--ok:#22A55B;--bad:#E5484D;--warn:#C98A06}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#E9E9E9}body{min-height:100vh;background:linear-gradient(180deg,#F6F6F6 0%,#E9E9E9 600px);}html,body{color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:440px;margin:0 auto;padding:18px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px}
.top .ttl{font-weight:600;font-size:15px;text-align:center;flex:1}
.logo{font-weight:800;font-size:24px;letter-spacing:-1px}
.tr{display:flex;gap:8px;align-items:center}
.icb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);cursor:pointer;flex:none}
.icb svg{width:18px;height:18px}
.blackpill{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;padding:9px 15px;border-radius:999px;font-weight:600;font-size:13px;position:relative;cursor:pointer;border:0}
.blackpill .ld{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--lime);border:2px solid #F6F6F6}
.muted{color:var(--muted)}.small{font-size:12px}
.hero{text-align:center;padding:6px 0 18px}
.lab{display:inline-flex;align-items:center;gap:8px;color:#555;font-size:13px}
.chip{width:22px;height:14px;border-radius:3px;background:var(--lime);display:inline-block}
.big{font-size:44px;font-weight:700;letter-spacing:-2px;line-height:1.1;margin:8px 0 10px}
.gpill{display:inline-block;background:#E2E2E2;color:#666;padding:5px 12px;border-radius:999px;font-size:12px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.duo a,.duo button{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;background:#fff;border-radius:16px;font-weight:600;border:0;cursor:pointer}
.duo svg{width:16px;height:16px}
.promo{background:var(--ink);color:#fff;border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:12px;overflow:hidden;cursor:pointer}
.promo .grow{flex:1}.promo b{display:block;font-size:15px;margin-bottom:4px}.promo p{font-size:12px;color:#BDBDBD;line-height:1.4}
.coin{width:58px;height:58px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0%,#d9d9d9 35%,#9a9a9a 70%,#cfcfcf 100%);display:grid;place-items:center;color:#7a7a7a;font-weight:800;font-size:22px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ch h3{font-size:15px;font-weight:600}
.ch a,.ch button{font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer}
.addp{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--text)!important}
.avrow{display:flex;gap:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.avrow::-webkit-scrollbar{display:none}
.avi{display:flex;flex-direction:column;align-items:center;gap:6px;width:58px;flex:none;font-size:11px;text-align:center}
.avi span{width:58px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;position:relative}
.avc i{position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-radius:50%;border:2px solid #fff}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer;border-top:1px solid #F1F1F1}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;text-align:right;white-space:nowrap}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:#666;display:inline-block}
.b-sent{background:#EAF1FF;color:#2F6BEA}.b-viewed{background:#F1ECFF;color:#6B4BD8}.b-accepted,.b-paid{background:#E7F7EE;color:var(--ok)}
.b-overdue{background:#FDECEC;color:var(--bad)}.b-part{background:#FFF5DE;color:var(--warn)}.b-declined,.b-expired,.b-draft{background:var(--soft);color:#777}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#111}
.btn.sm{padding:7px 12px;font-size:12px}.btn.ghost{background:transparent;border-color:transparent}.btn.danger{color:var(--bad)}
.btn.block{width:100%;padding:16px;font-size:15px}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.agrid .btn{width:100%}
label{display:block;font-size:12px;font-weight:600;color:#666;margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:14px;background:var(--soft);border:1px solid transparent;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink);background:#fff}
textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.magic{display:flex;gap:8px;align-items:center;background:#fff;border-radius:18px;padding:6px 6px 6px 8px}
.magic input{background:transparent;border:0;font-size:14px;padding:10px 6px}
.magic input:focus{background:transparent}
.hint{font-size:12px;color:var(--muted);margin:10px 4px 0}
.hint b{color:var(--text);font-weight:500;cursor:pointer;border-bottom:1px dashed #bbb}
.seg{display:flex;background:#E2E2E2;border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-weight:600;cursor:pointer;color:#777;font-size:13px}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.item{background:var(--soft);border-radius:16px;padding:10px;margin-bottom:8px}
.item .ir{display:grid;grid-template-columns:1fr 64px 110px 34px;gap:6px;align-items:center}
.item input,.item textarea{background:#fff}
.item textarea{min-height:40px;font-size:12px;margin-top:6px}
.x{height:40px;border-radius:12px;border:0;background:#fff;cursor:pointer;color:var(--muted)}
.total-line{display:flex;justify-content:space-between;padding:12px 2px 4px;font-weight:700;font-size:18px}
nav.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;display:flex;gap:6px;padding:7px;border-radius:999px;background:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.25)}
nav.bar a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#9a9a9a}
nav.bar a.on{color:#fff;box-shadow:inset 0 0 0 1.5px #5a5a5a;background:#222}
nav.bar a.new{background:var(--lime);color:#111}
nav.bar svg{width:20px;height:20px}
.ccard{border-radius:22px;padding:18px;height:178px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:10px;cursor:pointer}
.ccard.lime{background:var(--lime)}.ccard.black{background:var(--ink);color:#fff}.ccard.white{background:#fff}
.ccard .wm{position:absolute;left:10px;bottom:6px;font-size:84px;font-weight:800;letter-spacing:-4px;line-height:1;opacity:.07;pointer-events:none;white-space:nowrap}
.ccard.black .wm{opacity:.12}
.ccard .cn{font-size:13px;font-weight:500}.ccard .ca{font-size:24px;font-weight:700;letter-spacing:-.5px}
.ccard .cb{display:flex;justify-content:space-between;align-items:center;font-size:12px;position:relative}
.ccard .tag{background:#fff;color:#111;border-radius:999px;padding:5px 10px;font-weight:600;font-size:11px}
.ccard.white .tag{background:var(--soft)}
.amt-hero{text-align:center;padding:10px 0 20px}
.amt-hero .big{margin:6px 0}
.person{display:flex;align-items:center;gap:12px}
.person .grow{flex:1;min-width:0}
.paper{background:#fff;color:#141414;border-radius:22px;padding:26px 22px;font-size:13px}
.paper .ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}
.paper .doctype{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1}
.paper .meta{font-size:12px;color:#777;text-align:right}.paper .meta b{color:#141414}
.paper .parties{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;font-size:12px}
.paper .lab2{font-size:11px;color:#999;font-weight:600;margin-bottom:4px}
.paper table{width:100%;border-collapse:collapse;margin-bottom:14px}
.paper th{text-align:left;font-size:11px;color:#fff;padding:9px 8px;font-weight:600}
.paper th:first-child{border-radius:10px 0 0 10px}.paper th:last-child{border-radius:0 10px 10px 0}
.paper td{padding:11px 8px;border-bottom:1px solid #f0f0f0;vertical-align:top}
.paper td.r,.paper th.r{text-align:right}
.paper .det{color:#777;font-size:11px;white-space:pre-line;margin-top:3px}
.paper .tot{display:flex;justify-content:flex-end}.paper .tot div{min-width:210px}
.paper .tot p{display:flex;justify-content:space-between;padding:4px 0}
.paper .tot .grand{font-size:18px;font-weight:700;border-top:1.5px solid #141414;margin-top:6px;padding-top:8px}
.paper .words{font-size:11px;color:#888;margin-top:6px;text-align:right;font-style:italic}
.paper .foot{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:11px;color:#555;white-space:pre-line}
.paper .stamp{display:inline-block;background:var(--lime);color:#111;font-weight:800;font-size:13px;padding:4px 12px;border-radius:999px}
.blogo{max-height:40px;max-width:130px;object-fit:contain;margin-bottom:8px}
.timeline{list-style:none}
.timeline li{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:13px}
.timeline li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}
.timeline li:first-child::before{background:var(--lime);box-shadow:0 0 0 3px #111}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;transition:all .3s;z-index:70;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.celebrate{position:fixed;inset:0;display:grid;place-items:center;z-index:60;background:rgba(240,240,240,.85);backdrop-filter:blur(8px);animation:fade .3s}
.celebrate .box{text-align:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1);padding:20px}
.celebrate .tick{width:72px;height:72px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin:0 auto 14px;font-size:34px;font-weight:800}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}}
.conf{position:fixed;top:-10px;width:8px;height:12px;border-radius:2px;z-index:61;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:grid;place-items:end center;animation:fade .2s}
.sheet{width:100%;max-width:440px;background:#F2F2F2;border-radius:26px 26px 0 0;padding:18px 16px 26px;max-height:94vh;overflow:auto}
@media(min-width:600px){.modal{place-items:center}.sheet{border-radius:26px}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;border-radius:22px;padding:12px;margin:12px 0}
.pad button{height:50px;border-radius:14px;border:0;background:var(--soft);font-size:18px;font-weight:500;cursor:pointer;transition:background .1s}
.pad button:active,.pad button.hit{background:var(--lime)}
.keyamt{text-align:center;font-size:46px;font-weight:700;letter-spacing:-2px;padding:28px 0 18px}
.keyamt .caret{display:inline-block;width:3px;height:44px;background:var(--lime);vertical-align:-6px;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.view-wrap{max-width:720px;margin:0 auto}
.client-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0}
@media(min-width:760px){.view-wrap .paper{padding:40px}}
@media(max-width:380px){.item .ir{grid-template-columns:1fr 54px 92px 30px}.big{font-size:38px}.paper .parties,.paper .foot{grid-template-columns:1fr}}
@media print{nav.bar,.noprint,.top{display:none!important}html,body{background:#fff}#app{padding:0;max-width:none}.paper{border-radius:0;padding:0}}
</style>

<body>
<div id="app"></div>
<nav class="bar noprint" id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
/* ---------- storage ---------- */
const K='paidup_';
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(K+k));return (v===null||v===undefined)?d:v}catch(e){return d}};
const save=()=>{localStorage.setItem(K+'settings',JSON.stringify(S));localStorage.setItem(K+'clients',JSON.stringify(C));localStorage.setItem(K+'docs',JSON.stringify(D))};
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);

let S=load('settings',null),C=load('clients',null),D=load('docs',null);
if(!S){S={biz:'Your Studio',email:'',phone:'',logo:'',color:'#111111',currency:'NGN',acctName:'',acctNo:'',bank:'',terms:'50% upfront, balance on delivery.\nPayment due within 7 days of invoice.',tone:'polite',dueDays:7,validDays:14}}
if(S.color==='#F05E1C')S.color='#111111';
if(!C||!D)seed();
function seed(){
  const t=today();
  C=[{id:'c1',name:"Kemi's Kitchen",phone:'',email:'',notes:'Restaurant, Lekki'},{id:'c2',name:'Northwind Fitness',phone:'',email:'',notes:'Gym chain'},{id:'c3',name:'Adeyemi & Co',phone:'',email:'',notes:'Law firm'},{id:'c4',name:'Bloom Studio',phone:'',email:'',notes:'Florist'}];
  D=[
   {id:'d1',type:'invoice',num:'INV-001',clientId:'c1',title:'Monthly social media design',items:[{desc:'Social media design, monthly package',details:'20 designs\nWeekly delivery',qty:1,rate:160000}],date:addDays(t,-20),due:addDays(t,-6),status:'sent',payments:[],notes:'',tl:[{s:'created',at:addDays(t,-20)},{s:'sent',at:addDays(t,-20)}]},
   {id:'d2',type:'quote',num:'Q-001',clientId:'c2',title:'Brand identity refresh',items:[{desc:'Brand identity design',details:'Logo, colour, type, brand guide',qty:1,rate:450000}],date:addDays(t,-4),due:addDays(t,10),status:'viewed',payments:[],notes:'',tl:[{s:'created',at:addDays(t,-4)},{s:'sent',at:addDays(t,-4)},{s:'viewed',at:addDays(t,-3)}]},
   {id:'d3',type:'invoice',num:'INV-002',clientId:'c3',title:'Pitch deck design',items:[{desc:'Pitch deck design',details:'15 slides',qty:1,rate:120000}],date:addDays(t,-9),due:addDays(t,-2),status:'paid',payments:[{amt:120000,at:addDays(t,-1)}],notes:'',tl:[{s:'created',at:addDays(t,-9)},{s:'sent',at:addDays(t,-9)},{s:'paid',at:addDays(t,-1)}]},
   {id:'d4',type:'invoice',num:'INV-003',clientId:'c4',title:'Menu and flyer design',items:[{desc:'Menu design',details:'',qty:1,rate:60000},{desc:'Flyer design',details:'2 sizes',qty:2,rate:15000}],date:addDays(t,-2),due:addDays(t,5),status:'sent',payments:[],notes:'',tl:[{s:'created',at:addDays(t,-2)},{s:'sent',at:addDays(t,-2)}]}
  ];
  save();
}

/* ---------- money & derived ---------- */
const money=(n,cur)=>{try{return new Intl.NumberFormat('en-NG',{style:'currency',currency:cur||S.currency,maximumFractionDigits:0}).format(n||0)}catch(e){return (cur||S.currency)+' '+Math.round(n||0).toLocaleString()}};
const total=d=>d.items.reduce((a,i)=>a+(+i.qty||0)*(+i.rate||0),0);
const paid=d=>(d.payments||[]).reduce((a,p)=>a+(+p.amt||0),0);
const balance=d=>Math.max(0,total(d)-paid(d));
const client=id=>C.find(c=>c.id===id)||{name:'No client',id:''};
function state(d){
  if(d.type==='invoice'){
    if(d.status==='paid'||(total(d)>0&&balance(d)===0))return 'paid';
    if(d.status==='draft')return 'draft';
    if(d.due&&d.due<today())return 'overdue';
    if(paid(d)>0)return 'part';
    return d.status;
  }
  if(['sent','viewed'].includes(d.status)&&d.due&&d.due<today())return 'expired';
  return d.status;
}
const label={draft:'Draft',sent:'Sent',viewed:'Viewed',accepted:'Accepted',declined:'Declined',paid:'Paid',overdue:'Overdue',part:'Part paid',expired:'Expired'};
const badge=st=>`<span class="badge b-${st}">${label[st]||st}</span>`;
const owedDocs=()=>D.filter(d=>d.type==='invoice'&&!['draft','paid'].includes(state(d)));
const owed=()=>owedDocs().reduce((a,d)=>a+balance(d),0);
const thisMonthIn=()=>{const m=today().slice(0,7);return D.reduce((a,d)=>a+(d.payments||[]).filter(p=>p.at.slice(0,7)===m).reduce((x,p)=>x+(+p.amt),0),0)};
const fmtDate=s=>s?new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const fmtShort=s=>s?new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
const daysFrom=s=>Math.round((new Date(s+'T00:00')-new Date(today()+'T00:00'))/864e5);
function nextNum(type){const p=type==='quote'?'Q-':'INV-';const n=D.filter(d=>d.type===type).map(d=>parseInt((d.num||'').replace(/\D/g,''))||0);return p+String((n.length?Math.max(...n):0)+1).padStart(3,'0')}
function numWords(n){n=Math.round(n);if(!n)return 'zero';const a=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],b=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
 const h=x=>{let s='';if(x>=100){s+=a[Math.floor(x/100)]+' hundred';x%=100;if(x)s+=' and '}if(x>=20){s+=b[Math.floor(x/10)];if(x%10)s+='-'+a[x%10]}else if(x)s+=a[x];return s};
 const parts=[[1e9,'billion'],[1e6,'million'],[1e3,'thousand']];let out=[];for(const[v,w]of parts){if(n>=v){out.push(h(Math.floor(n/v))+' '+w);n%=v}}if(n)out.push(h(n));return out.join(' ')}
const curWord={NGN:'naira',USD:'dollars',GBP:'pounds',EUR:'euros',GHS:'cedis',KES:'shillings'};
const tints=[['#E9F9B4','#4C6B00'],['#E4ECFF','#2F55C9'],['#FFE6DA','#B4471B'],['#EFE6FF','#6A44C9'],['#DDF5EA','#1C7A4C'],['#FFF1C9','#8A6400']];
const tint=id=>{let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;return tints[h%tints.length]};
const avatar=(c,cls='av')=>{const[bg,fg]=tint(c.id||c.name);const ini=(c.name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();return `<div class="${cls}" style="background:${bg};color:${fg}">${esc(ini)}</div>`};

/* ---------- sentence parser ---------- */
function parseSentence(txt){
  const t=txt.trim();if(!t)return null;
  const type=/\b(quote|quotation|estimate)\b/i.test(t)?'quote':'invoice';
  let cur=S.currency;if(/\$|usd|dollar/i.test(t))cur='USD';else if(/£|gbp|pound/i.test(t))cur='GBP';else if(/€|eur/i.test(t))cur='EUR';else if(/₦|ngn|naira/i.test(t))cur='NGN';
  const am=t.match(/(?:₦|\$|£|€|ngn|usd|gbp|eur|n(?=\d))?\s?(\d[\d,]*(?:\.\d+)?)\s?(k|m|million|thousand)?\b/i);
  let amount=0;if(am){amount=parseFloat(am[1].replace(/,/g,''));const s=(am[2]||'').toLowerCase();if(s==='k'||s==='thousand')amount*=1e3;if(s==='m'||s==='million')amount*=1e6}
  let name='';const nm=t.match(/^(?:bill|invoice|quote|charge|send|create|make|new)?\s*(?:an?\s+)?(?:invoice|quote|quotation|estimate)?\s*(?:to|for)?\s*(.+?)\s*(?:₦|\$|£|€|ngn|usd|gbp|eur|\d)/i);
  if(nm)name=nm[1].replace(/\b(to|for)$/i,'').trim();
  let desc='';const dm=t.match(/\bfor\s+(?!\d)(.+?)(?:,?\s*due\b.*)?$/i);if(dm&&am&&t.indexOf(dm[0])>t.indexOf(am[0]))desc=dm[1].trim();
  let due=null;const du=t.match(/due\s+(?:in\s+)?(\d+)\s*(day|week)/i);if(du)due=+du[1]*(/week/i.test(du[2])?7:1);if(/due\s+tomorrow/i.test(t))due=1;
  return{type,cur,amount,name,desc:desc?desc.charAt(0).toUpperCase()+desc.slice(1):'',due};
}

function reminder(d,tone){
  const c=client(d.clientId).name, amt=money(balance(d)||total(d)), what=d.type==='quote'?'quote':'invoice', link=viewLink(d);
  const st=state(d);const when=d.type==='quote'?`is ready for your review`:st==='overdue'?`was due on ${fmtDate(d.due)}`:`is due on ${fmtDate(d.due)}`;
  tone=tone||S.tone;
  if(tone==='firm')return `Hello ${c}, ${what} ${d.num} for ${amt} ${when}. Please arrange payment today. You can view it here: ${link}\n\nThank you,\n${S.biz}`;
  if(tone==='abeg')return `Hi ${c} 😊 abeg, just checking in on ${what} ${d.num} (${amt}). It ${when}. Here's the link: ${link}\n\nThank you o!\n${S.biz}`;

  <div class="parties"><div><div class="lab2">From</div><b>${esc(S.biz)}</b>${S.email?'<div>'+esc(S.email)+'</div>':''}${S.phone?'<div>'+esc(S.phone)+'</div>':''}</div><div><div class="lab2">${d.type==='quote'?'Prepared for':'Billed to'}</div><b>${esc(c.name)}</b>${c.email?'<div>'+esc(c.email)+'</div>':''}${c.phone?'<div>'+esc(c.phone)+'</div>':''}</div></div>
  <table><thead><tr style="background:${col}"><th>Item</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr></thead><tbody>
  ${d.items.map(i=>`<tr><td><b>${esc(i.desc)}</b>${i.details?`<div class="det">${esc(i.details)}</div>`:''}</td><td class="r">${i.qty}</td><td class="r">${money(i.rate,d.cur)}</td><td class="r">${money(i.qty*i.rate,d.cur)}</td></tr>`).join('')}
  </tbody></table>
  <div class="tot"><div><p><span>Subtotal</span><span>${money(total(d),d.cur)}</span></p>${paid(d)?`<p><span>Paid</span><span>− ${money(paid(d),d.cur)}</span></p>`:''}<p class="grand"><span>${d.type==='invoice'&&paid(d)?'Balance':'Total'}</span><span>${money(d.type==='invoice'&&paid(d)?balance(d):total(d),d.cur)}</span></p></div></div>
  <div class="words">${numWords(total(d))} ${curWord[d.cur||S.currency]||''} only</div>
  <div class="foot"><div>${S.acctNo?`<div class="lab2">Pay by bank transfer</div>${esc(S.acctName)}\n${esc(S.acctNo)}\n${esc(S.bank)}`:''}</div><div>${(d.notes||S.terms)?`<div class="lab2">Notes and terms</div>${esc(d.notes||S.terms)}`:''}</div></div>
  </div>`;
}
function doc(id){
  const d=D.find(x=>x.id===id);if(!d)return `${topbar('')}<div class="empty">That document doesn't exist anymore.</div>`;
  const st=state(d),c=client(d.clientId);
  let main='';
  if(d.status==='draft')main=`<a class="btn pri block" target="_blank" href="${wa(firstMessage(d),c.phone)}" id="share">${ic.wa} Send on WhatsApp</a>`;
  else if(d.type==='quote'&&d.status==='accepted'){const inv=D.find(x=>x.fromQuote===d.id);main=inv?`<a class="btn pri block" href="#/doc/${inv.id}">Open ${inv.num}</a>`:`<button class="btn pri block" data-act="convert">Turn into invoice</button>`}
  else if(d.type==='quote'&&['sent','viewed','expired'].includes(st))main=`<button class="btn pri block" data-act="accept">Mark as accepted</button>`;
  else if(d.type==='invoice'&&st!=='paid')main=`<button class="btn pri block" data-act="pay">Record payment</button>`;
  const A=[];
  if(d.status!=='draft'&&st!=='paid'&&!['accepted','declined'].includes(d.status))A.push(`<a class="btn" target="_blank" href="${wa(reminder(d),c.phone)}" id="share">${ic.wa} Remind</a>`);
  if(d.status==='draft')A.push(`<button class="btn" data-act="sent">Mark as sent</button>`);
  A.push(`<button class="btn" data-act="print">Download PDF</button>`,`<a class="btn" href="#/edit/${d.id}">Edit</a>`,`<button class="btn" data-act="dup">Duplicate</button>`);
  if(d.type==='quote'&&['sent','viewed'].includes(d.status))A.push(`<button class="btn" data-act="decline">Declined</button>`);
  A.push(`<button class="btn danger" data-act="del">Delete</button>`);
  const sub=st==='overdue'?`<span class="neg">${Math.abs(daysFrom(d.due))} days overdue</span>`:d.type==='invoice'&&st!=='paid'&&st!=='draft'?`Due ${daysFrom(d.due)===0?'today':'in '+daysFrom(d.due)+' days'}`:d.type==='quote'&&['sent','viewed'].includes(st)?`Valid until ${fmtShort(d.due)}`:'';
  return `${topbar((d.type==='quote'?'Quote ':'Invoice ')+esc(d.num),`<button class="icb" data-act="copy" title="Copy link">${ic.link}</button>`)}
  <div class="amt-hero noprint">${badge(st)}<div class="big">${money(d.type==='invoice'&&st!=='paid'?balance(d):total(d),d.cur)}</div><div class="muted small">${sub}</div></div>
  <div class="card noprint"><div class="small muted" style="margin-bottom:10px">${d.type==='quote'?'Quote for':'Billed to'}</div><div class="person">${avatar(c)}<div class="grow"><div style="font-weight:600">${esc(c.name)}</div><div class="small muted">${esc(c.phone||c.notes||'No number yet')}</div></div><a class="btn sm" href="#/client/${c.id}">Open</a></div></div>
  <div class="noprint" style="margin-bottom:10px">${main}</div>
  <div class="card noprint"><div class="agrid">${A.join('')}</div></div>
  ${paperHTML(d)}
  <div class="card noprint" style="margin-top:12px"><div class="ch"><h3>What's happened</h3></div><ul class="timeline">${[...d.tl].reverse().map(t=>`<li><span style="text-transform:capitalize;font-weight:500">${esc(t.s)}</span><span class="muted small" style="margin-left:auto">${fmtShort(t.at)}</span></li>`).join('')}</ul></div>`;
}
doc._bind=id=>{
  const d=D.find(x=>x.id===id);if(!d)return;
  const sh=$('#share');sh&&sh.addEventListener('click',()=>{if(d.status==='draft'){d.status='sent';d.tl.push({s:'sent',at:today()})}else d.tl.push({s:'reminder sent',at:today()});save();setTimeout(render,300)});
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;
   if(a==='accept'){d.status='accepted';d.tl.push({s:'accepted',at:today()});save();toast('Accepted. Nice.');render()}
   if(a==='decline'){d.status='declined';d.tl.push({s:'declined',at:today()});save();render()}
   if(a==='sent'){d.status='sent';d.tl.push({s:'sent',at:today()});save();render()}
   if(a==='convert')convert(d.id);
   if(a==='pay')payment(d);
   if(a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(viewLink(d));toast('Link copied')}
   if(a==='print')window.print();
   if(a==='dup'){const n=JSON.parse(JSON.stringify(d));n.id=uid();n.num=nextNum(d.type);n.status='draft';n.payments=[];n.date=today();n.due=addDays(today(),d.type==='quote'?S.validDays:S.dueDays);n.tl=[{s:'created',at:today()}];delete n.fromQuote;D.push(n);save();go('/doc/'+n.id)}
   if(a==='del'){if(confirm('Delete '+d.num+'? This cannot be undone.')){D=D.filter(x=>x.id!==d.id);save();go('/home')}}
  });
};
function convert(qid){const q=D.find(x=>x.id===qid);const n=JSON.parse(JSON.stringify(q));n.id=uid();n.type='invoice';n.num=nextNum('invoice');n.status='draft';n.date=today();n.due=addDays(today(),S.dueDays);n.fromQuote=q.id;n.payments=[];n.tl=[{s:'created from '+q.num,at:today()}];D.push(n);q.tl.push({s:'invoiced as '+n.num,at:today()});save();toast('Invoice '+n.num+' ready');go('/doc/'+n.id)}

/* payment: keypad screen */
function payment(d){
  const c=client(d.clientId);let val=String(balance(d));
  const keys=['1','2','3','4','5','6','7','8','9','000','0','del'];
  sheet(`<div class="top" style="margin-bottom:12px"><button class="icb" id="px">${ic.back}</button><div class="ttl">Record payment</div><span style="width:38px"></span></div>
  <div class="card" style="margin-bottom:0"><div class="small muted" style="margin-bottom:10px">Received from</div><div class="person">${avatar(c)}<div class="grow"><div style="font-weight:600">${esc(c.name)}</div><div class="small muted">${esc(d.num)} · balance ${money(balance(d),d.cur)}</div></div><button class="btn sm" id="pfull">Full</button></div></div>
  <div class="keyamt"><span id="kv"></span><span class="caret"></span></div>
  <div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:0"><div class="chip" style="width:34px;height:22px;border-radius:5px"></div><div class="grow" style="flex:1"><div style="font-weight:600;font-size:13px">Date received</div></div><input type="date" id="pdate" value="${today()}" style="width:auto;padding:8px 10px"></div>
  <div class="pad">${keys.map(k=>`<button data-k="${k}">${k==='del'?ic.del.replace('<svg','<svg width="20" height="20"'):k}</button>`).join('')}</div>
  <button class="btn pri block" id="pok">Save payment</button>`,(m,close)=>{
    const show=()=>{m.querySelector('#kv').textContent=money(+val||0,d.cur)};show();
    m.querySelector('#px').onclick=close;
    m.querySelector('#pfull').onclick=()=>{val=String(balance(d));show()};
    m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='del')val=val.slice(0,-1);else if(val.length<12)val=(val==='0'?'':val)+k;show();b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),150)});
    m.querySelector('#pok').onclick=()=>{const amt=+val;if(!amt){toast('Enter an amount');return}d.payments.push({amt,at:m.querySelector('#pdate').value||today()});
      const full=balance(d)===0;if(full)d.status='paid';d.tl.push({s:full?'paid':'part payment '+money(amt,d.cur),at:today()});save();close();render();celebrate(amt)};
  });
}

/* ---------- CLIENTS ---------- */
function clients(){
  const styles=['lime','black','white'];
  const cards=C.map((c,i)=>{const ds=D.filter(d=>d.clientId===c.id);const o=ds.filter(d=>d.type==='invoice'&&!['draft','paid'].includes(state(d))).reduce((a,d)=>a+balance(d),0);const late=ds.some(d=>state(d)==='overdue');
   return `<a class="ccard ${styles[i%3]}" href="#/client/${c.id}"><div class="wm">Paidup</div><div><div class="cn">${esc(c.name)}</div><div class="ca">${o?money(o):'Settled'}</div><div class="small" style="opacity:.6">${o?'owed to you':'nothing outstanding'}</div></div><div class="cb"><span style="opacity:.7">${ds.length} document${ds.length===1?'':'s'}</span>${late?'<span class="tag" style="color:var(--bad)">● Late</span>':`<span class="tag">${esc(c.notes||'Client')}</span>`}</div></a>`}).join('');
  return `<div class="top"><div class="logo" style="font-size:22px">Clients</div><button class="blackpill" id="addc">+ New client</button></div>${cards||'<div class="card empty">No clients yet. They get added when you create a quote or invoice.</div>'}`;
}
clients._bind=(id,q)=>{$('#addc').onclick=()=>clientForm();if(q.get('add'))clientForm()};
function clientForm(c){const isNew=!c;c=c||{id:uid(),name:'',phone:'',email:'',notes:''};
 sheet(`<div class="top" style="margin-bottom:8px"><span style="width:38px"></span><div class="ttl">${isNew?'New client':'Edit client'}</div><button class="icb" id="fx">✕</button></div><div class="card"><label style="margin-top:0">Name</label><input id="fn" value="${esc(c.name)}"><label>WhatsApp number</label><input id="fp" value="${esc(c.phone)}" placeholder="0803..."><label>Email</label><input id="fe" value="${esc(c.email)}"><label>Notes</label><input id="fno" value="${esc(c.notes)}" placeholder="What they do, where they are"></div>
 <button class="btn pri block" id="fok">Save client</button>`,(m,close)=>{m.querySelector('#fx').onclick=close;m.querySelector('#fok').onclick=()=>{c.name=m.querySelector('#fn').value.trim();if(!c.name){toast('Add a name');return}c.phone=m.querySelector('#fp').value;c.email=m.querySelector('#fe').value;c.notes=m.querySelector('#fno').value;if(isNew)C.push(c);save();close();if(location.hash.includes('add=1'))go('/clients');else render()}})}
function clientPage(id){
  const c=C.find(x=>x.id===id);if(!c)return `${topbar('')}<div class="empty">Client not found.</div>`;
  const ds=D.filter(d=>d.clientId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const o=ds.filter(d=>d.type==='invoice'&&!['draft','paid'].includes(state(d))).reduce((a,d)=>a+balance(d),0),inn=ds.reduce((a,d)=>a+paid(d),0);
  return `${topbar(esc(c.name),`<button class="icb" id="editc">${ic.user}</button>`)}
  <div class="hero">${avatar(c,'avc').replace('class="avc"','class="avc" style="margin:0 auto 10px;width:64px;height:64px;font-size:20px"').replace('style="','style="margin:0 auto 10px;width:64px;height:64px;font-size:20px;')}<div class="lab">Owes you <span class="chip"></span></div><div class="big">${money(o)}</div><span class="gpill">Paid you ${money(inn)} so far</span></div>
  <div class="duo"><a href="#/new?type=quote&client=${c.id}">${ic.up} Quote</a><a href="#/new?type=invoice&client=${c.id}">${ic.down} Invoice</a></div>
  ${c.phone?`<a class="promo" target="_blank" href="${wa('Hi '+c.name+', ',c.phone)}"><div class="grow"><b>Message ${esc(c.name.split(' ')[0])}</b><p>Open a WhatsApp chat with ${esc(c.phone)}</p></div><div class="coin" style="color:#1c7a4c">${ic.wa.replace('<svg','<svg width="26" height="26"')}</div></a>`:''}
  <div class="card"><div class="ch"><h3>History</h3><span class="muted small">${ds.length}</span></div><div class="list">${ds.map(d=>row(d)).join('')||'<div class="empty">Nothing for this client yet.</div>'}</div></div>`;
}
clientPage._bind=id=>{bindRows();$('#editc').onclick=()=>clientForm(C.find(x=>x.id===id))};

/* ---------- SETTINGS ---------- */
function settings(){
  const cur=['NGN','USD','GBP','EUR','GHS','KES'];
  return `<div class="top"><div class="logo" style="font-size:22px">Settings</div></div>
  <div class="card"><div class="ch"><h3>Your business</h3></div>
   <label style="margin-top:0">Business name</label><input data-s="biz" value="${esc(S.biz)}"><div class="grid2"><div><label>Email</label><input data-s="email" value="${esc(S.email)}"></div><div><label>Phone</label><input data-s="phone" value="${esc(S.phone)}"></div></div>
   <div class="grid2"><div><label>Logo</label><input type="file" accept="image/*" id="logo">${S.logo?`<div style="margin-top:8px;display:flex;align-items:center;gap:8px"><img src="${S.logo}" style="max-height:34px"><button class="btn sm" id="rmlogo">Remove</button></div>`:''}</div><div><label>Document colour</label><input type="color" data-s="color" value="${S.color}" style="height:48px;padding:4px"></div></div></div>
  <div class="card"><div class="ch"><h3>How you get paid</h3></div>
   <label style="margin-top:0">Currency</label><select data-s="currency">${cur.map(x=>`<option ${x===S.currency?'selected':''}>${x}</option>`).join('')}</select>
   <label>Account name</label><input data-s="acctName" value="${esc(S.acctName)}"><div class="grid2"><div><label>Account number</label><input data-s="acctNo" value="${esc(S.acctNo)}"></div><div><label>Bank</label><input data-s="bank" value="${esc(S.bank)}"></div></div>
   <div class="grid2"><div><label>Invoices due after (days)</label><input type="number" data-s="dueDays" value="${S.dueDays}"></div><div><label>Quotes valid for (days)</label><input type="number" data-s="validDays" value="${S.validDays}"></div></div>
   <label>Default terms</label><textarea data-s="terms">${esc(S.terms)}</textarea></div>
  <div class="card"><div class="ch"><h3>Reminder tone</h3></div><div class="seg">${[['polite','Polite'],['firm','Firm'],['abeg','Abeg o']].map(([k,l])=>`<button data-tone="${k}" class="${S.tone===k?'on':''}">${l}</button>`).join('')}</div>
   <div class="small" style="white-space:pre-line;margin-top:12px;background:var(--soft);border-radius:14px;padding:12px;color:#555">${esc(reminder({num:'INV-004',type:'invoice',clientId:'',items:[{qty:1,rate:150000}],payments:[],due:addDays(today(),-3),status:'sent',id:'preview'}))}</div></div>
  <div class="card"><div class="ch"><h3>Your data</h3></div><p class="muted small">Everything is saved on this device for now. Back it up now and then.</p>
   <div class="agrid" style="margin-top:12px"><button class="btn" id="exp">Download backup</button><label class="btn" style="margin:0;font-size:13px;color:var(--text)">Restore backup<input type="file" id="imp" accept=".json" hidden></label><button class="btn danger" id="wipe" style="grid-column:span 2">Start fresh</button></div></div>`;
}
settings._bind=()=>{
  document.querySelectorAll('[data-s]').forEach(i=>i.oninput=()=>{const k=i.dataset.s;S[k]=i.type==='number'?+i.value:i.value;save()});
  document.querySelectorAll('[data-s="currency"]').forEach(i=>i.onchange=()=>{S.currency=i.value;save();toast('Currency set to '+i.value)});
  document.querySelectorAll('[data-tone]').forEach(b=>b.onclick=()=>{S.tone=b.dataset.tone;save();render()});
  $('#logo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;save();render();toast('Logo added')};r.readAsDataURL(f)};
  const rm=$('#rmlogo');rm&&(rm.onclick=()=>{S.logo='';save();render()});
  $('#exp').onclick=()=>{const b=new Blob([JSON.stringify({S,C,D},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='paidup-backup-'+today()+'.json';a.click()};
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);S=j.S;C=j.C;D=j.D;save();toast('Backup restored');render()}catch(x){toast("That file didn't work")}};r.readAsText(f)};
  $('#wipe').onclick=()=>{if(confirm('Delete every client and document on this device?')){C=[];D=[];save();go('/home')}};
};

/* ---------- CLIENT VIEW ---------- */
function view(id){
  const d=D.find(x=>x.id===id);if(!d)return `<div class="card empty" style="margin-top:40px">This link isn't available on this device yet.</div>`;
  if(d.status==='sent'){d.status='viewed';d.tl.push({s:'viewed',at:today()});save()}
  const st=state(d);
  return `<div class="view-wrap"><div class="noprint" style="text-align:center;margin:6px 0 16px"><div class="logo" style="font-size:18px">${esc(S.biz)}</div><div class="muted small">sent you a ${d.type}</div></div>
  ${paperHTML(d)}
  <div class="client-bar noprint">${d.type==='quote'&&!['accepted','declined'].includes(d.status)?`<button class="btn pri" id="vacc">Accept quote</button>`:''}${d.type==='quote'&&d.status==='accepted'?'<span class="badge b-accepted" style="padding:9px 14px">✓ You accepted this quote</span>':''}
  ${d.type==='invoice'&&st!=='paid'&&S.acctNo?`<button class="btn pri" id="vpay">Pay ${money(balance(d),d.cur)}</button>`:''}${st==='paid'?'<span class="badge b-paid" style="padding:9px 14px">✓ Paid. Thank you!</span>':''}<button class="btn" onclick="window.print()">Download PDF</button></div>
  <div class="noprint muted small" style="text-align:center;margin-top:24px">Made with <b style="color:#111">Paidup</b></div></div>`;
}
view._bind=id=>{const d=D.find(x=>x.id===id);if(!d)return;
  const a=$('#vacc');a&&(a.onclick=()=>{d.status='accepted';d.tl.push({s:'accepted by client',at:today()});save();render();toast('Quote accepted. '+S.biz+' has been notified.')});
  const p=$('#vpay');p&&(p.onclick=()=>sheet(`<div class="top" style="margin-bottom:8px"><span style="width:38px"></span><div class="ttl">Pay by bank transfer</div><button class="icb" id="vx">✕</button></div>
   <div class="keyamt" style="padding:16px 0">${money(balance(d),d.cur)}</div><div class="muted small" style="text-align:center;margin:-8px 0 14px">Use ${esc(d.num)} as your reference</div>
   <div class="card"><div class="small muted">Account name</div><div style="font-weight:600;margin-bottom:10px">${esc(S.acctName)}</div><div class="small muted">Account number</div><div style="font-weight:700;font-size:22px;letter-spacing:1px;margin-bottom:10px">${esc(S.acctNo)}</div><div class="small muted">Bank</div><div style="font-weight:600">${esc(S.bank)}</div></div>
   <div class="agrid"><button class="btn" id="cpy">Copy number</button><button class="btn pri" id="done">I've sent it</button></div>`,(m,close)=>{m.querySelector('#vx').onclick=close;m.querySelector('#cpy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(S.acctNo);toast('Copied')};m.querySelector('#done').onclick=()=>{d.tl.push({s:'client says paid',at:today()});save();close();toast('Thanks! '+S.biz+' will confirm shortly.')}}));
};

render();
</script>
</body>
</html>
